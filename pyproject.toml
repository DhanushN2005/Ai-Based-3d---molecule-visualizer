[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["static", "outputs", "molecules", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["UP015"]

[tool.ruff.lint.per-file-ignores]
# main.py loads .env and reconfigures stdout before the heavy imports on purpose
"main.py" = ["E402"]
"tests/*" = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["."]
omit = ["tests/*", "export_glb_blender.py", "blender_script_gen.py"]
