<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%235eead4'/%3E%3Ccircle cx='6' cy='8' r='3.5' fill='%2338bdf8'/%3E%3Ccircle cx='26' cy='9' r='3.5' fill='%2338bdf8'/%3E%3Ccircle cx='16' cy='27' r='3.5' fill='%2338bdf8'/%3E%3Cpath d='M16 16L6 8M16 16l10-7M16 16v11' stroke='%2394a3b8' stroke-width='2'/%3E%3C/svg%3E">
  <title>ChemVerse3D</title>
  <style>
    :root {
      --accent: #5eead4;
      --accent-2: #38bdf8;
      --text: #f1f5f9;
      --muted: #cbd5e1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: #0b1220;
    }
    .bg-video {
      position: fixed; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover; z-index: -2;
    }
    .overlay {
      position: fixed; inset: 0; z-index: -1;
      background: radial-gradient(ellipse at top, rgba(11,18,32,.55), rgba(11,18,32,.88));
    }
    main {
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center;
      padding: 24px;
    }
    .card {
      width: 100%; max-width: 480px;
      padding: 40px 32px;
      background: rgba(15, 23, 42, .6);
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 20px;
      box-shadow: 0 20px 60px rgba(0,0,0,.45);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      text-align: center;
    }
    .logo { font-size: 40px; line-height: 1; }
    h1 {
      margin: 12px 0 6px;
      font-size: 1.7rem;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      -webkit-background-clip: text; background-clip: text;
      color: transparent;
    }
    .sub { margin: 0 0 24px; color: var(--muted); font-size: .95rem; }
    form { display: flex; gap: 8px; }
    input[type="text"] {
      flex: 1; min-width: 0;
      padding: 13px 16px;
      font-size: 1rem;
      color: var(--text);
      background: rgba(255,255,255,.08);
      border: 1px solid rgba(255,255,255,.18);
      border-radius: 12px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input[type="text"]::placeholder { color: #94a3b8; }
    input[type="text"]:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(94,234,212,.25);
    }
    button {
      padding: 13px 22px;
      font-size: 1rem; font-weight: 600;
      color: #04211d;
      background: linear-gradient(90deg, var(--accent), var(--accent-2));
      border: none; border-radius: 12px;
      cursor: pointer;
      transition: transform .1s, opacity .15s;
    }
    button:hover { transform: translateY(-1px); }
    button:disabled { opacity: .55; cursor: wait; transform: none; }
    button.secondary {
      color: var(--text);
      background: rgba(255,255,255,.12);
      border: 1px solid rgba(255,255,255,.2);
      margin-top: 8px;
    }
    .chips { margin-top: 20px; display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      padding: 6px 12px; font-size: .85rem;
      color: var(--muted);
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.15);
      border-radius: 999px;
      cursor: pointer;
      transition: background .15s, color .15s;
    }
    .chip:hover { background: rgba(94,234,212,.18); color: var(--text); }
    .links { margin-top: 20px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; }
    .links a { padding: 8px 14px; font-size: .9rem; color: var(--text); text-decoration: none;
               background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.18); border-radius: 10px; }
    .links a:hover { background: rgba(94,234,212,.2); }
    .credit { margin: 22px 0 0; font-size: .82rem; color: var(--muted); }
    .credit a { color: var(--accent); text-decoration: none; }
    .credit a:hover { text-decoration: underline; }
    #status { margin-top: 20px; min-height: 1.4em; font-size: .95rem; color: var(--muted); }
    .spinner {
      display: inline-block; width: 14px; height: 14px; margin-right: 8px;
      vertical-align: -2px;
      border: 2px solid rgba(255,255,255,.3); border-top-color: var(--accent);
      border-radius: 50%; animation: spin .8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #error-text { color: #fca5a5; }
    #manual-link { display: none; }
    @media (max-width: 480px) {
      .card { padding: 28px 20px; }
      form { flex-direction: column; }
    }
    @media (prefers-reduced-motion: reduce) {
      .bg-video { display: none; }
      .spinner { animation: none; }
    }
  </style>
</head>
<body>
  <video class="bg-video" autoplay muted loop playsinline>
    <source src="{{ url_for('static', filename='bg.mp4') }}" type="video/mp4">
  </video>
  <div class="overlay"></div>

  <main>
    <div class="card">
      <h1><a href="/" style="color:inherit;text-decoration:none">ChemVerse3D</a></h1>
      <p class="sub">Search any molecule (built-in list or PubChem) and explore it in 3D.</p>

      <form id="molForm" autocomplete="off">
        <input type="text" id="molecule-input" name="molecule" list="molecule-list"
               placeholder="e.g. caffeine, dopamine, ibuprofen" required autofocus>
        <button type="submit" id="submit-btn">Generate</button>
      </form>
      <datalist id="molecule-list">
        {% for m in molecules %}<option value="{{ m }}">{% endfor %}
      </datalist>

      <div class="chips" id="chips">
        {% for m in molecules[:6] %}<span class="chip" role="button" tabindex="0" data-name="{{ m }}">{{ m }}</span>{% endfor %}
      </div>

      <div class="links">
        <a href="/quiz">Quiz mode</a>
        <a href="/compare">Compare two molecules</a>
        <a href="/leaderboard">Leaderboard</a>
        {% if current_user %}<a href="/favorites">Favourites</a>{% else %}<a href="/login">Log in</a>{% endif %}
      </div>

      <div id="status" role="status" aria-live="polite"></div>
      <p class="credit">Built by <a href="https://dhanushnataraj.netlify.app" target="_blank" rel="noopener noreferrer">Dhanush Nataraj</a></p>
      <div id="manual-link">
        <button type="button" class="secondary" id="go-btn">Go to viewer</button>
      </div>
    </div>
  </main>

  <script>
    const form = document.getElementById("molForm");
    const input = document.getElementById("molecule-input");
    const btn = document.getElementById("submit-btn");
    const status = document.getElementById("status");
    const manual = document.getElementById("manual-link");
    let redirectURL = "";

    function setStatus(html, isError) {
      status.innerHTML = html;
      status.id = "status";
      status.className = isError ? "error" : "";
      status.style.color = isError ? "#fca5a5" : "";
    }

    async function generate(name) {
      name = name.trim().toLowerCase();
      if (!name) { setStatus("Please enter a molecule name.", true); return; }
      btn.disabled = true;
      manual.style.display = "none";
      setStatus('<span class="spinner"></span>Looking up and building the 3D model… new molecules can take a few seconds.');

      try {
        const body = new FormData();
        body.append("molecule", name);
        const res = await fetch("/search", { method: "POST", body });
        const data = await res.json();
        if (data.success) {
          redirectURL = data.viewer_url;
          setStatus("Done! Opening the viewer…");
          manual.style.display = "block";
          setTimeout(() => { window.location.href = redirectURL; }, 800);
        } else {
          setStatus(data.error || "Unknown error occurred.", true);
          btn.disabled = false;
        }
      } catch (err) {
        console.error(err);
        setStatus("Something went wrong. Please try again.", true);
        btn.disabled = false;
      }
    }

    // live suggestions: built-in names first, then PubChem
    let suggestTimer = null;
    input.addEventListener("input", () => {
      clearTimeout(suggestTimer);
      const q = input.value.trim();
      if (q.length < 2) return;
      suggestTimer = setTimeout(async () => {
        try {
          const res = await fetch("/api/suggest?q=" + encodeURIComponent(q));
          if (!res.ok) return;
          const { names } = await res.json();
          const list = document.getElementById("molecule-list");
          list.innerHTML = "";
          names.forEach(n => { const o = document.createElement("option"); o.value = n; list.appendChild(o); });
        } catch (_) { /* suggestions are optional */ }
      }, 250);
    });

    form.addEventListener("submit", e => { e.preventDefault(); generate(input.value); });
    document.getElementById("go-btn").addEventListener("click", () => {
      if (redirectURL) window.location.href = redirectURL;
    });
    document.getElementById("chips").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (chip) { input.value = chip.dataset.name; generate(chip.dataset.name); }
    });
    document.getElementById("chips").addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") {
        const chip = e.target.closest(".chip");
        if (chip) { e.preventDefault(); chip.click(); }
      }
    });
  </script>
</body>
</html>
