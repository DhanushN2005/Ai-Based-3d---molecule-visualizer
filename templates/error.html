<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%235eead4'/%3E%3Ccircle cx='6' cy='8' r='3.5' fill='%2338bdf8'/%3E%3Ccircle cx='26' cy='9' r='3.5' fill='%2338bdf8'/%3E%3Ccircle cx='16' cy='27' r='3.5' fill='%2338bdf8'/%3E%3Cpath d='M16 16L6 8M16 16l10-7M16 16v11' stroke='%2394a3b8' stroke-width='2'/%3E%3C/svg%3E">
  <title>{{ title }} · ChemVerse3D</title>
  <style>
    body { margin: 0; min-height: 100vh; color: #f1f5f9; background: #0b1220;
           font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .wrap { display: grid; place-items: center; min-height: calc(100vh - 140px); padding: 24px; }
    .card { max-width: 440px; text-align: center; padding: 36px; background: #131c31;
            border: 1px solid rgba(255,255,255,.1); border-radius: 18px; }
    .card h1 { margin: 0 0 8px; }
    .card p { color: #a8b4c7; line-height: 1.6; }
    .card a.go { display: inline-block; margin-top: 14px; padding: 11px 20px; color: #04211d; font-weight: 700;
                 text-decoration: none; border-radius: 10px; background: linear-gradient(90deg, #5eead4, #38bdf8); }
    footer { text-align: center; padding: 0 16px 26px; font-size: .82rem; color: #94a3b8; }
    footer a { color: #5eead4; text-decoration: none; }
  </style>
</head>
<body>
  {% include "_nav.html" %}
  <main class="wrap">
    <div class="card">
      <h1>{{ title }}</h1>
      <p>{{ message }}</p>
      <a class="go" href="/search">Back to search</a>
    </div>
  </main>
  <footer>Built by <a href="https://dhanushnataraj.netlify.app" target="_blank" rel="noopener noreferrer">Dhanush Nataraj</a></footer>
</body>
</html>
