{# Login state for the top bars. The styles are inlined so it works on every page. #}
<style>
  .acct { display:flex; align-items:center; gap:14px; }
  .acct form { margin:0; }
  .acct button { padding:0; font:inherit; color:var(--muted,#94a3b8); background:none; border:none; cursor:pointer; }
  .acct button:hover, .acct a:hover { color:var(--accent,#5eead4); }
  .acct a { color:var(--muted,#94a3b8); text-decoration:none; }
  .acct .who { color:var(--text,#f1f5f9); }
</style>
<span class="acct">
  <a href="/leaderboard">Leaderboard</a>
  {% if current_user %}
    <a href="/favorites">Favourites</a>
    <span class="who">{{ current_user.username }}</span>
    <form method="post" action="/logout"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}"><button type="submit">Log out</button></form>
  {% else %}
    <a href="/login">Log in</a>
  {% endif %}
</span>
