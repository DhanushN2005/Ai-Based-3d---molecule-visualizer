<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='6' fill='%235eead4'/%3E%3Ccircle cx='6' cy='8' r='3.5' fill='%2338bdf8'/%3E%3Ccircle cx='26' cy='9' r='3.5' fill='%2338bdf8'/%3E%3Ccircle cx='16' cy='27' r='3.5' fill='%2338bdf8'/%3E%3Cpath d='M16 16L6 8M16 16l10-7M16 16v11' stroke='%2394a3b8' stroke-width='2'/%3E%3C/svg%3E">
  <title>Favourites · ChemVerse3D</title>
  <meta name="csrf-token" content="{{ csrf_token() }}">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}">
</head>
<body>
  {% include "_nav.html" %}
  <main>
    <div class="card">
      <h1>Your favourites</h1>
      <p class="muted">Molecules you starred in the viewer.</p>
      {% if names %}
      <ul class="list" id="fav-list">
        {% for n in names %}
        <li data-name="{{ n }}">
          <a class="name" href="/viewer/{{ n | urlencode }}">{{ n }}</a>
          <a class="btn" href="/compare?a={{ n | urlencode }}">Compare</a>
          <button class="btn remove" type="button">Remove</button>
        </li>
        {% endfor %}
      </ul>
      {% endif %}
      <p class="empty" id="empty" {% if names %}hidden{% endif %}>No favourites yet. Open a molecule and click the star.</p>
    </div>
  </main>
  <footer style="text-align:center;padding:10px 16px 28px;font-size:.82rem;color:#94a3b8">Built by <a href="https://dhanushnataraj.netlify.app" target="_blank" rel="noopener noreferrer" style="color:#5eead4;text-decoration:none">Dhanush Nataraj</a></footer>
  <script>
    const token = document.querySelector('meta[name="csrf-token"]').content;
    document.querySelectorAll("#fav-list .remove").forEach(btn => btn.addEventListener("click", async () => {
      const li = btn.closest("li");
      const res = await fetch("/api/favorites/" + encodeURIComponent(li.dataset.name),
                              { method: "POST", headers: { "X-CSRF-Token": token } });
      if (res.ok) {
        li.remove();
        if (!document.querySelector("#fav-list li")) document.getElementById("empty").hidden = false;
      }
    }));
  </script>
</body>
</html>
